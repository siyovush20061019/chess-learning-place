<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Learning Place</title>
    <!-- Подключаем надежные стили шахматной доски со стабильного сервера cdnjs -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        header { background: #2d2d2d; color: #00ff88; padding: 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin: 0; font-size: 2.5rem; }
        .subtitle { color: #aaa; font-style: italic; margin-top: 5px; }
        .container { max-width: 600px; margin: 20px auto; background: #2d2d2d; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        /* Контейнер для доски */
        #myBoard { width: 100%; max-width: 450px; margin: 20px auto; border: 4px solid #444; border-radius: 6px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .info-box { font-size: 1.1rem; line-height: 1.6; color: #ddd; margin-bottom: 10px; }
    </style>
</head>
<body>

    <header>
        <h1>Chess Learning Place</h1>
        <p class="subtitle">Строим интерактивную платформу для шахматистов в прямом эфире! 🚀</p>
    </header>

    <div class="container">
        <h2>Наша интерактивная доска</h2>
        <p class="info-box">Доска полностью автономна. Вы можете использовать её для расстановки фигур и разбора партий:</p>
        
        <!-- Сюда скрипт выведет шахматы -->
        <div id="myBoard"></div>
    </div>

    <!-- Подключаем jQuery и ChessboardJS со сверхнадежного CDN -->
    <script src="https://jquery.com"></script>
    <script src="https://cloudflare.com"></script>
    <script>
        // Запуск доски сразу после загрузки страницы
        $(document).ready(function() {
            var config = {
                draggable: true,      /* Разрешаем двигать фигуры */
                dropOffBoard: 'trash', /* Фигуры можно выбрасывать за доску */
                position: 'start'     /* Начальная расстановка */
            };
            var board = Chessboard('myBoard', config);
        });
    </script>
</body>
</html>
