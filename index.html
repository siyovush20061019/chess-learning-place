<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Learning Place</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1e1e1e; color: #fff; margin: 0; padding: 20px; }
        header { background: #2d2d2d; color: #00ff88; padding: 30px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        h1 { margin: 0; font-size: 2.5rem; }
        .subtitle { color: #aaa; font-style: italic; margin-top: 5px; }
        .container { max-width: 700px; margin: 20px auto; background: #2d2d2d; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        iframe { width: 100%; max-width: 600px; height: 440px; border: none; border-radius: 8px; background: #fff; }
        .info-box { font-size: 1.1rem; line-height: 1.6; color: #ddd; margin-bottom: 20px; }
    </style>
</head>
<body>

    <header>
        <h1>Chess Learning Place</h1>
        <p class="subtitle">Строим интерактивную платформу для шахматистов в прямом эфире! 🚀</p>
    </header>

    <div class="container">
        <h2>Шахматная задача дня</h2>
        <p class="info-box">Добро пожаловать! Наша платформа находится в разработке, но вы уже можете размять мозг. Решите интерактивную тактическую задачу прямо сейчас (ход белых или черных указан на доске):</p>
        
        <!-- Бесплатный интерактивный виджет задач от Lichess -->
        <iframe src="https://lichess.org" allowtransparency="true"></iframe>
    </div>

</body>
</html>
